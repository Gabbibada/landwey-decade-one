<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LandWey @ 10: Decade One (2016–2026) | Commemorative Monograph Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-panel: rgba(18, 18, 22, 0.85);
      --bg-card: #151518;
      --gold-primary: #C5A059;
      --gold-light: #DFBA73;
      --gold-dark: #8F7034;
      --gold-gradient: linear-gradient(135deg, #E6C885 0%, #C5A059 50%, #9A7532 100%);
      --text-main: #FFFFFF;
      --text-muted: #9A9AA2;
      --border-subtle: rgba(197, 160, 89, 0.25);
      --border-bright: rgba(197, 160, 89, 0.7);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(15, 15, 18, 0.9) 0%, #060608 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    header {
      height: 64px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .gold-pip {
      width: 8px;
      height: 8px;
      background: var(--gold-gradient);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.6);
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .spread-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .spread-indicator strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button.btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    button.btn:hover {
      background: rgba(197, 160, 89, 0.15);
      border-color: var(--border-bright);
      color: var(--gold-light);
    }

    button.btn-primary {
      background: var(--gold-gradient);
      color: #0A0A0C;
      font-weight: 600;
      border: none;
    }

    button.btn-primary:hover {
      background: linear-gradient(135deg, #F0D597 0%, #D4AE62 100%);
      color: #000;
      box-shadow: 0 0 16px rgba(197, 160, 89, 0.4);
    }

    /* MAIN VIEWPORT */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
    }

    .viewer-stage {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.3s ease;
    }

    .spread-frame {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.85),
        0 0 1px 1px rgba(197, 160, 89, 0.2);
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: grab;
    }

    .spread-frame:active {
      cursor: grabbing;
    }

    .spread-image {
      display: block;
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 190px);
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* Nav Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      background: rgba(18, 18, 22, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      transition: var(--transition);
    }

    .nav-arrow:hover {
      background: var(--gold-gradient);
      color: #0A0A0C;
      border-color: transparent;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }
    .nav-arrow.disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    /* BOTTOM THUMBNAILS TRAY */
    footer {
      height: 96px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 50;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dark) transparent;
    }

    footer::-webkit-scrollbar {
      height: 5px;
    }
    footer::-webkit-scrollbar-thumb {
      background: var(--gold-dark);
      border-radius: 4px;
    }

    .thumb-item {
      flex: 0 0 auto;
      height: 68px;
      border-radius: 4px;
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      opacity: 0.5;
    }

    .thumb-item:hover {
      opacity: 0.85;
      transform: translateY(-2px);
      border-color: rgba(197, 160, 89, 0.4);
    }

    .thumb-item.active {
      opacity: 1;
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(197, 160, 89, 0.5);
      transform: translateY(-3px);
    }

    .thumb-item img {
      height: 100%;
      width: auto;
      display: block;
    }

    .thumb-label {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      background: rgba(10, 10, 12, 0.85);
      font-size: 8px;
      text-align: center;
      padding: 1px 0;
      border-radius: 2px;
      color: var(--gold-light);
      letter-spacing: 0.5px;
    }

    /* CHAPTERS MODAL / DRAWER */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 8, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      justify-content: flex-start;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      width: 440px;
      max-width: 90vw;
      height: 100%;
      background: #101014;
      border-right: 1px solid var(--border-subtle);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 30px 0 60px rgba(0, 0, 0, 0.6);
    }

    .drawer-overlay.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-title {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--gold-light);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover { color: #FFF; }

    .chapter-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 8px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }

    .chapter-item:hover {
      background: rgba(197, 160, 89, 0.1);
      border-color: var(--border-subtle);
    }

    .chapter-item.active {
      background: rgba(197, 160, 89, 0.15);
      border-color: var(--gold-primary);
    }

    .ch-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .ch-num {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .ch-name {
      font-size: 13px;
      color: #EEE;
      letter-spacing: 0.3px;
    }

    .ch-page {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* FULLSCREEN TOAST */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid var(--border-subtle);
      color: #EEE;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 0.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* SVG ICONS */
    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 768px) {
      header { padding: 0 12px; height: 56px; }
      .main-title { font-size: 11px; }
      .subtitle { display: none; }
      footer { height: 76px; }
      .thumb-item { height: 52px; }
      .nav-arrow { width: 42px; height: 42px; }
      .nav-arrow.prev { left: 8px; }
      .nav-arrow.next { right: 8px; }
      .spread-image {
        max-width: 100vw;
        max-height: calc(100vh - 140px);
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-section">
      <div class="gold-pip"></div>
      <div class="title-group">
        <div class="main-title">LandWey @ 10</div>
        <div class="subtitle">Decade One (2016–2026) — A Decade of Vision</div>
      </div>
    </div>

    <div class="spread-indicator">
      <span>SPREAD <strong id="currentSpreadDisplay">02</strong> OF <strong>41</strong></span>
      <span style="opacity: 0.3">|</span>
      <span id="pagesDisplay">PAGES 02–03</span>
    </div>

    <div class="controls-group">
      <button class="btn" id="tocToggleBtn">
        <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span>Chapters</span>
      </button>

      <button class="btn" id="zoomFitBtn" title="Reset Zoom">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>

      <button class="btn" id="fsToggleBtn" title="Toggle Fullscreen">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>

      <a href="../Landwey at 10_UPDATED.pdf" target="_blank" download class="btn btn-primary" title="Download Master Print PDF">
        <svg class="icon" viewBox="0 0 24 24" style="stroke: #0A0A0C"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <!-- MAIN SPREAD VIEWER -->
  <main id="mainContainer">
    <div class="nav-arrow prev" id="prevBtn" title="Previous Spread (Left Arrow)">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>

    <div class="viewer-stage" id="viewerStage">
      <div class="spread-frame" id="spreadFrame">
        <img class="spread-image" id="activeSpreadImg" src="spreads/spread2.jpg" alt="LandWey @ 10 Spread Preview">
      </div>
    </div>

    <div class="nav-arrow next" id="nextBtn" title="Next Spread (Right Arrow)">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </main>

  <!-- BOTTOM THUMBNAILS TRAY -->
  <footer id="thumbTray"></footer>

  <!-- CHAPTERS DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div class="drawer-title">TABLE OF CONTENTS</div>
        <button class="close-btn" id="drawerCloseBtn">&times;</button>
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </div>
  </div>

  <div class="toast" id="toastNotice">Use Left/Right arrow keys or click sides to navigate</div>

  <script>
    // 41 SPREADS METADATA
    const TOTAL_SPREADS = 41;
    const spreadsData = [];

    // Table of contents milestone chapters
    const chapters = [
      { spread: 1,  page: '01', title: 'Front Cover', desc: 'A Decade of Vision' },
      { spread: 2,  page: '02–03', title: 'Prologue & Editorial Introduction', desc: 'Turning Points & The Ten-Year Idea' },
      { spread: 3,  page: '04–05', title: 'Curatorial Overview', desc: 'Monograph Architecture & TOC' },
      { spread: 4,  page: '06–07', title: 'Chapter 01: The Origin', desc: 'The Desire to Improve the Sector' },
      { spread: 6,  page: '10–11', title: 'Chapter 02: The Wedge', desc: 'Finding the Untapped Market' },
      { spread: 8,  page: '14–15', title: 'Chapter 03: The Early Blueprint', desc: 'Establishing the Standard' },
      { spread: 9,  page: '16–17', title: 'Chapter 04: The Middle Market', desc: 'Closing the Housing Deficit' },
      { spread: 11, page: '20–21', title: 'Chapter 05: Speed as a Moat', desc: 'Execution Dynamics' },
      { spread: 13, page: '24–25', title: 'Chapter 06: Brand Architecture', desc: 'Redefining African Real Estate' },
      { spread: 15, page: '28–29', title: 'Chapter 07: Strategic Land Banking', desc: 'Spatial Intelligence & Corridors' },
      { spread: 17, page: '32–33', title: 'Chapter 08: Urban Prime', desc: 'The Flagship Residential Series' },
      { spread: 19, page: '36–37', title: 'Chapter 09: Master Planning', desc: 'Urban Engineering Excellence' },
      { spread: 21, page: '40–41', title: 'Chapter 10: The Human Machine', desc: 'Workforce & Talent Engine' },
      { spread: 22, page: '42–43', title: 'Chapter 11: The Digital Shift', desc: 'Show the Work / Drone Inspection' },
      { spread: 24, page: '46–47', title: 'Chapter 12: Built Through Adversity', desc: 'The Storm & Hard-Won Resilience' },
      { spread: 25, page: '48–49', title: 'Chapter 13: The Builders', desc: 'Engineers & Architects on Site' },
      { spread: 27, page: '52–53', title: 'Chapter 14: The Human Side', desc: 'Executive Leadership Quotes' },
      { spread: 29, page: '56–57', title: 'Chapter 15: Social Value & CSR', desc: 'Building Beyond Boundaries' },
      { spread: 31, page: '60–61', title: 'Chapter 16: A City Called Epe', desc: 'The Infrastructure Multiplier' },
      { spread: 32, page: '62–63', title: 'Chapter 17: Isimi Lagos', desc: 'Africa’s Premier Polo & Wellness City' },
      { spread: 34, page: '66–67', title: 'Chapter 18: The Faces of Trust', desc: 'Diaspora & Domestic Homeowners' },
      { spread: 35, page: '68–69', title: 'Chapter 18: The Handover Moment', desc: 'When Value Becomes Tangible' },
      { spread: 36, page: '70–71', title: 'Chapter 19: Recognition', desc: 'Industry Honors & Milestones' },
      { spread: 37, page: '72–73', title: 'Chapter 20: Numbers & Track Record', desc: 'Analytical 10-Year Track Record' },
      { spread: 39, page: '76–77', title: 'Chapter 21: Systems: What Comes After Ten?', desc: 'Scalable Institutional Horizon' },
      { spread: 40, page: '78–79', title: 'Founder’s Closing Letter', desc: 'Olawale Ayilara / The Next Map' },
      { spread: 41, page: '80',    title: 'Back Cover', desc: 'LandWey 2.0 Seal' }
    ];

    // Build spreads data
    for (let i = 1; i <= TOTAL_SPREADS; i++) {
      let pages = '';
      if (i === 1) pages = 'PAGE 01 (COVER)';
      else if (i === TOTAL_SPREADS) pages = 'PAGE 80 (BACK COVER)';
      else {
        const p1 = (i - 1) * 2;
        const p2 = p1 + 1;
        pages = `PAGES ${String(p1).padStart(2, '0')}–${String(p2).padStart(2, '0')}`;
      }
      spreadsData.push({
        spread: i,
        file: `spreads/spread${i}.jpg`,
        pages: pages
      });
    }

    // STATE
    let currentSpread = 2; // Default to opening spread (Pages 2-3 with Baskerville & Olawale portrait)
    let zoomLevel = 1.0;

    // DOM ELEMENTS
    const activeImg = document.getElementById('activeSpreadImg');
    const spreadFrame = document.getElementById('spreadFrame');
    const currentSpreadDisplay = document.getElementById('currentSpreadDisplay');
    const pagesDisplay = document.getElementById('pagesDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const thumbTray = document.getElementById('thumbTray');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const tocToggleBtn = document.getElementById('tocToggleBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const chapterList = document.getElementById('chapterList');
    const zoomFitBtn = document.getElementById('zoomFitBtn');
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    const toastNotice = document.getElementById('toastNotice');

    // INITIALIZE THUMBNAILS
    spreadsData.forEach((item) => {
      const thumb = document.createElement('div');
      thumb.className = `thumb-item ${item.spread === currentSpread ? 'active' : ''}`;
      thumb.dataset.spread = item.spread;
      thumb.innerHTML = `
        <img src="${item.file}" loading="lazy" alt="Spread ${item.spread}">
        <div class="thumb-label">${item.spread === 1 ? 'COV' : item.spread === 41 ? 'BACK' : (item.spread-1)*2}</div>
      `;
      thumb.addEventListener('click', () => goToSpread(item.spread));
      thumbTray.appendChild(thumb);
    });

    // INITIALIZE CHAPTERS DRAWER
    chapters.forEach((ch) => {
      const row = document.createElement('div');
      row.className = `chapter-item ${ch.spread === currentSpread ? 'active' : ''}`;
      row.dataset.spread = ch.spread;
      row.innerHTML = `
        <div class="ch-left">
          <div class="ch-num">${ch.page}</div>
          <div>
            <div class="ch-name">${ch.title}</div>
            <div style="font-size: 11px; color: #777;">${ch.desc}</div>
          </div>
        </div>
        <div class="ch-page">Spread ${ch.spread}</div>
      `;
      row.addEventListener('click', () => {
        goToSpread(ch.spread);
        closeDrawer();
      });
      chapterList.appendChild(row);
    });

    // NAVIGATION
    function goToSpread(spreadNum) {
      if (spreadNum < 1 || spreadNum > TOTAL_SPREADS) return;
      currentSpread = spreadNum;
      
      // Update image with smooth fade
      spreadFrame.style.opacity = '0.3';
      spreadFrame.style.transform = 'scale(0.99)';

      const preload = new Image();
      preload.src = spreadsData[spreadNum - 1].file;
      preload.onload = () => {
        activeImg.src = preload.src;
        spreadFrame.style.opacity = '1';
        spreadFrame.style.transform = 'scale(1)';
      };

      // Update header labels
      currentSpreadDisplay.textContent = String(spreadNum).padStart(2, '0');
      pagesDisplay.textContent = spreadsData[spreadNum - 1].pages;

      // Update buttons
      prevBtn.classList.toggle('disabled', spreadNum === 1);
      nextBtn.classList.toggle('disabled', spreadNum === TOTAL_SPREADS);

      // Update thumbnails active state & scroll into view
      document.querySelectorAll('.thumb-item').forEach((el) => {
        const active = parseInt(el.dataset.spread) === spreadNum;
        el.classList.toggle('active', active);
        if (active) {
          el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });

      // Update chapter drawer active state
      document.querySelectorAll('.chapter-item').forEach((el) => {
        el.classList.toggle('active', parseInt(el.dataset.spread) === spreadNum);
      });

      // Reset zoom on page change
      resetZoom();
    }

    function prevSpread() {
      if (currentSpread > 1) goToSpread(currentSpread - 1);
    }

    function nextSpread() {
      if (currentSpread < TOTAL_SPREADS) goToSpread(currentSpread + 1);
    }

    prevBtn.addEventListener('click', prevSpread);
    nextBtn.addEventListener('click', nextSpread);

    // CLICK ON IMAGE SIDES TO TURN PAGE
    spreadFrame.addEventListener('click', (e) => {
      const rect = spreadFrame.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width * 0.4) {
        prevSpread();
      } else if (clickX > rect.width * 0.6) {
        nextSpread();
      }
    });

    // KEYBOARD NAVIGATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSpread();
      else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') nextSpread();
      else if (e.key === 'Home') goToSpread(1);
      else if (e.key === 'End') goToSpread(TOTAL_SPREADS);
      else if (e.key === 'Escape') closeDrawer();
    });

    // SWIPE TOUCH NAVIGATION FOR MOBILE / IPADS
    let touchStartX = 0;
    let touchEndX = 0;
    spreadFrame.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    spreadFrame.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) nextSpread();
      if (touchEndX - touchStartX > 50) prevSpread();
    }, { passive: true });

    // DRAWER TOGGLE
    function openDrawer() { drawerOverlay.classList.add('open'); }
    function closeDrawer() { drawerOverlay.classList.remove('open'); }
    tocToggleBtn.addEventListener('click', openDrawer);
    drawerCloseBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) closeDrawer();
    });

    // ZOOM CONTROLS
    function resetZoom() {
      zoomLevel = 1.0;
      spreadFrame.style.transform = `scale(1)`;
    }

    zoomFitBtn.addEventListener('click', () => {
      if (zoomLevel === 1.0) {
        zoomLevel = 1.35;
        spreadFrame.style.transform = `scale(${zoomLevel})`;
        showToast('Zoomed 135% (Click reset to fit)');
      } else {
        resetZoom();
        showToast('Fit to screen');
      }
    });

    // FULLSCREEN
    fsToggleBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    function showToast(msg) {
      toastNotice.textContent = msg;
      toastNotice.classList.add('show');
      setTimeout(() => toastNotice.classList.remove('show'), 2200);
    }

    // INITIAL LOAD
    goToSpread(2);
    setTimeout(() => {
      showToast('Use Left/Right arrow keys or click sides to flip pages');
    }, 1200);
  </script>
</body>
</html>
