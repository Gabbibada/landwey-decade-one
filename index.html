<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>LandWey @ 10: Decade One (2016–2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-panel: rgba(16, 16, 20, 0.88);
      --bg-card: #141418;
      --gold-primary: #C5A059;
      --gold-light: #DFBA73;
      --gold-dark: #8F7034;
      --gold-gradient: linear-gradient(135deg, #E6C885 0%, #C5A059 50%, #9A7532 100%);
      --text-main: #FFFFFF;
      --text-muted: #9A9AA2;
      --border-subtle: rgba(197, 160, 89, 0.22);
      --border-bright: rgba(197, 160, 89, 0.7);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(15, 15, 18, 0.95) 0%, #060608 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* TOP HEADER */
    header {
      height: 60px;
      min-height: 60px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gold-pip {
      width: 8px;
      height: 8px;
      background: var(--gold-gradient);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.6);
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* CENTER INDICATOR */
    .indicator-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .indicator-pill strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    /* CONTROLS GROUP */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-family: inherit;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
    }

    button.btn:hover {
      background: rgba(197, 160, 89, 0.16);
      border-color: var(--border-bright);
      color: var(--gold-light);
    }

    button.btn-active {
      background: rgba(197, 160, 89, 0.22);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    button.btn-primary {
      background: var(--gold-gradient);
      color: #0A0A0C;
      font-weight: 600;
      border: none;
    }

    button.btn-primary:hover {
      background: linear-gradient(135deg, #F0D597 0%, #D4AE62 100%);
      color: #000;
      box-shadow: 0 0 14px rgba(197, 160, 89, 0.4);
    }

    /* MAIN VIEWPORT */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      min-height: 0;
    }

    .viewer-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .spread-frame {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.85),
        0 0 1px 1px rgba(197, 160, 89, 0.2);
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .spread-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      /* Dynamic sizing to prevent overflow on mobile */
      max-height: calc(100dvh - 150px);
    }

    /* SIDE ARROWS (DESKTOP) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      transition: var(--transition);
    }

    .nav-arrow:hover {
      background: var(--gold-gradient);
      color: #0A0A0C;
      border-color: transparent;
      box-shadow: 0 0 18px rgba(197, 160, 89, 0.5);
      transform: translateY(-50%) scale(1.06);
    }

    .nav-arrow.prev { left: 16px; }
    .nav-arrow.next { right: 16px; }
    .nav-arrow.disabled {
      opacity: 0.15;
      pointer-events: none;
    }

    /* MOBILE FLOATING ACTION BAR */
    .mobile-bar {
      display: none;
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 16, 20, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 6px 10px;
      z-index: 45;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .mobile-bar button {
      background: none;
      border: none;
      color: #EEE;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
    }
    .mobile-bar button:active {
      background: rgba(197, 160, 89, 0.2);
      color: var(--gold-light);
    }

    .mobile-page-text {
      font-size: 12px;
      color: var(--gold-light);
      font-weight: 600;
      letter-spacing: 0.5px;
      min-width: 80px;
      text-align: center;
    }

    /* BOTTOM THUMBNAILS TRAY */
    footer {
      height: 84px;
      min-height: 84px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 12px max(8px, env(safe-area-inset-bottom)) 12px;
      gap: 8px;
      z-index: 50;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dark) transparent;
      transition: transform 0.3s ease, height 0.3s ease;
    }

    footer.collapsed {
      height: 0;
      min-height: 0;
      overflow: hidden;
      border-top: none;
      padding: 0;
    }

    footer::-webkit-scrollbar {
      height: 4px;
    }
    footer::-webkit-scrollbar-thumb {
      background: var(--gold-dark);
      border-radius: 4px;
    }

    .thumb-item {
      flex: 0 0 auto;
      height: 60px;
      border-radius: 4px;
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      opacity: 0.45;
    }

    .thumb-item:hover {
      opacity: 0.85;
      transform: translateY(-2px);
      border-color: rgba(197, 160, 89, 0.4);
    }

    .thumb-item.active {
      opacity: 1;
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(197, 160, 89, 0.5);
      transform: translateY(-2px);
    }

    .thumb-item img {
      height: 100%;
      width: auto;
      display: block;
    }

    .thumb-label {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      background: rgba(10, 10, 12, 0.88);
      font-size: 8px;
      text-align: center;
      padding: 1px 0;
      border-radius: 2px;
      color: var(--gold-light);
      letter-spacing: 0.5px;
    }

    /* CHAPTERS DRAWER */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 8, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      justify-content: flex-start;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      width: 400px;
      max-width: 88vw;
      height: 100%;
      background: #101014;
      border-right: 1px solid var(--border-subtle);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.7);
    }

    .drawer-overlay.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--gold-light);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .chapter-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }

    .chapter-item:hover, .chapter-item:active {
      background: rgba(197, 160, 89, 0.12);
      border-color: var(--border-subtle);
    }

    .chapter-item.active {
      background: rgba(197, 160, 89, 0.18);
      border-color: var(--gold-primary);
    }

    .ch-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .ch-num {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .ch-name {
      font-size: 12px;
      color: #EEE;
    }

    .ch-page {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(16, 16, 20, 0.95);
      border: 1px solid var(--border-subtle);
      color: #EEE;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 0.4px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* MOBILE RESPONSIVE OPTIMIZATIONS */
    @media (max-width: 768px) {
      header {
        height: 52px;
        min-height: 52px;
        padding: 0 12px;
      }
      .subtitle { display: none; }
      .main-title { font-size: 12px; }
      .indicator-pill { display: none; } /* Show in floating mobile bar instead */
      
      .btn span.desktop-only { display: none; }
      .btn { padding: 6px 9px; }

      .nav-arrow { display: none; } /* Use swipe and mobile floating bar on mobile */
      .mobile-bar { display: flex; }

      main {
        padding: 8px 6px;
      }
      .spread-image {
        max-height: calc(100dvh - 125px);
        max-width: 98vw;
      }

      /* On mobile, collapse footer thumbnails by default for full screen viewing */
      footer {
        height: 0;
        min-height: 0;
        padding: 0;
        border: none;
        overflow: hidden;
      }
      footer.mobile-open {
        height: 72px;
        min-height: 72px;
        padding: 0 8px;
        border-top: 1px solid var(--border-subtle);
      }
      .thumb-item { height: 50px; }
    }
  </style>
</head>

      { spread: 41, page: 80, label: 'Cover',  title: 'Back Cover', desc: 'LandWey 2.0 Seal' }
    ];

    // STATE
    // Detect mobile portrait: default to Single Page on phones, Spread on desktop
    const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
    let viewMode = isMobilePortrait ? 'single' : 'spread'; // 'spread' or 'single'
    
    // START AT SPREAD 1 / PAGE 1 (COVER)
    let currentSpread = 1;
    let currentPage = 1;

    // DOM ELEMENTS
    const activeImg = document.getElementById('activeImg');
    const spreadFrame = document.getElementById('spreadFrame');
    const desktopIndicator = document.getElementById('desktopIndicator');
    const indicatorText = document.getElementById('indicatorText');
    const viewModeBadge = document.getElementById('viewModeBadge');
    const viewModeToggleBtn = document.getElementById('viewModeToggleBtn');
    const viewModeLabel = document.getElementById('viewModeLabel');
    const viewModeIcon = document.getElementById('viewModeIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const mobilePrevBtn = document.getElementById('mobilePrevBtn');
    const mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobilePageText = document.getElementById('mobilePageText');
    const thumbTray = document.getElementById('thumbTray');
    const thumbToggleBtn = document.getElementById('thumbToggleBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const tocToggleBtn = document.getElementById('tocToggleBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const chapterList = document.getElementById('chapterList');
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    const toastNotice = document.getElementById('toastNotice');

    // CONVERSIONS BETWEEN PAGE AND SPREAD
    function pageToSpread(page) {
      if (page <= 1) return 1;
      if (page >= TOTAL_PAGES) return TOTAL_SPREADS;
      return Math.floor(page / 2) + 1;
    }

    function spreadToPages(spread) {
      if (spread === 1) return { start: 1, end: 1, label: 'COVER' };
      if (spread === TOTAL_SPREADS) return { start: 80, end: 80, label: 'BACK COVER' };
      const p1 = (spread - 1) * 2;
      const p2 = p1 + 1;
      return { start: p1, end: p2, label: `PAGES ${String(p1).padStart(2, '0')}–${String(p2).padStart(2, '0')}` };
    }

    // UPDATE DISPLAY
    function renderView() {
      spreadFrame.style.opacity = '0.3';
      spreadFrame.style.transform = 'scale(0.99)';

      let targetSrc = '';
      if (viewMode === 'spread') {
        targetSrc = `spreads/spread${currentSpread}.jpg`;
        const info = spreadToPages(currentSpread);
        indicatorText.innerHTML = `SPREAD <strong>${String(currentSpread).padStart(2, '0')}</strong> OF <strong>${TOTAL_SPREADS}</strong> (${info.label})`;
        viewModeBadge.textContent = 'SPREAD VIEW';
        mobilePageText.textContent = currentSpread === 1 ? 'COVER' : currentSpread === TOTAL_SPREADS ? 'BACK' : `P. ${info.start}–${info.end}`;
        prevBtn.classList.toggle('disabled', currentSpread === 1);
        nextBtn.classList.toggle('disabled', currentSpread === TOTAL_SPREADS);
        mobilePrevBtn.style.opacity = currentSpread === 1 ? '0.3' : '1';
        mobileNextBtn.style.opacity = currentSpread === TOTAL_SPREADS ? '0.3' : '1';
      } else {
        targetSrc = `pages/page${currentPage}.jpg`;
        indicatorText.innerHTML = `PAGE <strong>${String(currentPage).padStart(2, '0')}</strong> OF <strong>${TOTAL_PAGES}</strong>`;
        viewModeBadge.textContent = 'SINGLE PAGE';
        mobilePageText.textContent = `PAGE ${String(currentPage).padStart(2, '0')} / ${TOTAL_PAGES}`;
        prevBtn.classList.toggle('disabled', currentPage === 1);
        nextBtn.classList.toggle('disabled', currentPage === TOTAL_PAGES);
        mobilePrevBtn.style.opacity = currentPage === 1 ? '0.3' : '1';
        mobileNextBtn.style.opacity = currentPage === TOTAL_PAGES ? '0.3' : '1';
      }

      const preload = new Image();
      preload.src = targetSrc;
      preload.onload = () => {
        activeImg.src = preload.src;
        spreadFrame.style.opacity = '1';
        spreadFrame.style.transform = 'scale(1)';
      };

      // Update Thumbnails
      updateThumbnails();

      // Update Chapters Drawer
      updateChapters();
    }

    // NAVIGATION METHODS
    function goNext() {
      if (viewMode === 'spread') {
        if (currentSpread < TOTAL_SPREADS) {
          currentSpread++;
          currentPage = spreadToPages(currentSpread).start;
          renderView();
        }
      } else {
        if (currentPage < TOTAL_PAGES) {
          currentPage++;
          currentSpread = pageToSpread(currentPage);
          renderView();
        }
      }
    }

    function goPrev() {
      if (viewMode === 'spread') {
        if (currentSpread > 1) {
          currentSpread--;
          currentPage = spreadToPages(currentSpread).start;
          renderView();
        }
      } else {
        if (currentPage > 1) {
          currentPage--;
          currentSpread = pageToSpread(currentPage);
          renderView();
        }
      }
    }

    function jumpTo(spreadNum, pageNum) {
      if (spreadNum) {
        currentSpread = Math.max(1, Math.min(TOTAL_SPREADS, spreadNum));
        currentPage = pageNum || spreadToPages(currentSpread).start;
      } else if (pageNum) {
        currentPage = Math.max(1, Math.min(TOTAL_PAGES, pageNum));
        currentSpread = pageToSpread(currentPage);
      }
      renderView();
    }

    // VIEW MODE TOGGLE
    function toggleViewMode() {
      if (viewMode === 'spread') {
        viewMode = 'single';
        currentPage = spreadToPages(currentSpread).start;
        viewModeLabel.textContent = 'Spread View';
        viewModeIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
        `;
        showToast('Switched to Single Page View');
      } else {
        viewMode = 'spread';
        currentSpread = pageToSpread(currentPage);
        viewModeLabel.textContent = 'Single Page';
        viewModeIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="12" y1="3" x2="12" y2="21"></line>
        `;
        showToast('Switched to Double Spread View');
      }
      renderThumbnailsTray();
      renderView();
    }

    viewModeToggleBtn.addEventListener('click', toggleViewMode);

    // THUMBNAILS TRAY BUILDER
    function renderThumbnailsTray() {
      thumbTray.innerHTML = '';
      if (viewMode === 'spread') {
        for (let i = 1; i <= TOTAL_SPREADS; i++) {
          const info = spreadToPages(i);
          const thumb = document.createElement('div');
          thumb.className = `thumb-item ${i === currentSpread ? 'active' : ''}`;
          thumb.dataset.index = i;
          thumb.innerHTML = `
            <img src="spreads/spread${i}.jpg" loading="lazy" alt="Spread ${i}">
            <div class="thumb-label">${i === 1 ? 'COV' : i === TOTAL_SPREADS ? 'BACK' : info.start}</div>
          `;
          thumb.addEventListener('click', () => {
            currentSpread = i;
            currentPage = info.start;
            renderView();
          });
          thumbTray.appendChild(thumb);
        }
      } else {
        for (let p = 1; p <= TOTAL_PAGES; p++) {
          const thumb = document.createElement('div');
          thumb.className = `thumb-item ${p === currentPage ? 'active' : ''}`;
          thumb.dataset.index = p;
          thumb.innerHTML = `
            <img src="pages/page${p}.jpg" loading="lazy" alt="Page ${p}">
            <div class="thumb-label">${p === 1 ? 'COV' : p === 80 ? 'BACK' : 'P.' + p}</div>
          `;
          thumb.addEventListener('click', () => {
            currentPage = p;
            currentSpread = pageToSpread(p);
            renderView();
          });
          thumbTray.appendChild(thumb);
        }
      }
    }

    function updateThumbnails() {
      const activeIdx = viewMode === 'spread' ? currentSpread : currentPage;
      document.querySelectorAll('.thumb-item').forEach((el) => {
        const isActive = parseInt(el.dataset.index) === activeIdx;
        el.classList.toggle('active', isActive);
        if (isActive) {
          el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });
    }

    // CHAPTERS DRAWER BUILDER
    function renderChaptersDrawer() {
      chapterList.innerHTML = '';
      chapters.forEach((ch) => {
        const item = document.createElement('div');
        item.className = 'chapter-item';
        item.dataset.spread = ch.spread;
        item.dataset.page = ch.page;
        item.innerHTML = `
          <div class="ch-left">
            <div class="ch-num">${ch.label}</div>
            <div>
              <div class="ch-name">${ch.title}</div>
              <div style="font-size: 11px; color: #777;">${ch.desc}</div>
            </div>
          </div>
          <div class="ch-page">P. ${ch.page}</div>
        `;
        item.addEventListener('click', () => {
          jumpTo(ch.spread, ch.page);
          closeDrawer();
        });
        chapterList.appendChild(item);
      });
    }

    function updateChapters() {
      document.querySelectorAll('.chapter-item').forEach((el) => {
        const s = parseInt(el.dataset.spread);
        const p = parseInt(el.dataset.page);
        const isActive = (viewMode === 'spread' && s === currentSpread) || (viewMode === 'single' && p === currentPage);
        el.classList.toggle('active', isActive);
      });
    }

    // EVENT LISTENERS
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    mobilePrevBtn.addEventListener('click', goPrev);
    mobileNextBtn.addEventListener('click', goNext);

    // CLICK SCREEN SIDES TO FLIP
    spreadFrame.addEventListener('click', (e) => {
      const rect = spreadFrame.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width * 0.4) {
        goPrev();
      } else if (clickX > rect.width * 0.6) {
        goNext();
      }
    });

    // KEYBOARD NAVIGATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') goPrev();
      else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') goNext();
      else if (e.key === 'Home') jumpTo(1, 1);
      else if (e.key === 'End') jumpTo(TOTAL_SPREADS, TOTAL_PAGES);
      else if (e.key.toLowerCase() === 'm') toggleViewMode();
      else if (e.key === 'Escape') closeDrawer();
    });

    // MOBILE SWIPE GESTURES
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;

    spreadFrame.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    spreadFrame.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;
      // Only horizontal swipes
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX > 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    // DRAWER HANDLERS
    function openDrawer() { drawerOverlay.classList.add('open'); }
    function closeDrawer() { drawerOverlay.classList.remove('open'); }
    tocToggleBtn.addEventListener('click', openDrawer);
    drawerCloseBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) closeDrawer();
    });

    // THUMBNAILS TOGGLE
    thumbToggleBtn.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        thumbTray.classList.toggle('mobile-open');
      } else {
        thumbTray.classList.toggle('collapsed');
      }
    });

    // FULLSCREEN
    fsToggleBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    function showToast(msg) {
      toastNotice.textContent = msg;
      toastNotice.classList.add('show');
      setTimeout(() => toastNotice.classList.remove('show'), 2200);
    }

    // INITIALIZATION
    renderThumbnailsTray();
    renderChaptersDrawer();
    // EXPLICITLY START AT PAGE 1 / SPREAD 1 (COVER)
    jumpTo(1, 1);
  </script>
</body>
</html>
